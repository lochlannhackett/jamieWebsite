<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamie Wong Illustration</title>
    <style>
        @font-face {
            font-family: 'Font2025';
            src: url('font2025.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Acidic';
            src: url('Acidic.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Font2025', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            z-index: 1000;
            background-color: transparent;
        }

        /* Logo */
        .logo {
            display: block;
            line-height: 0;
            padding: 0;
            margin: 0;
        }

        .logo img {
            width: 228px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
            display: block;
            padding: 0;
            margin: 0;
        }

        .logo:hover img {
            opacity: 1;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            gap: 40px;
        }

        .top-nav a {
            font-family: 'Acidic', sans-serif;
            text-decoration: none;
            color: #bc2b2d;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        .top-nav a:hover {
            color: #888;
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        /* Center Image */
        .center-image {
            max-width: 819px;
            width: 100%;
        }

        .center-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .logo img {
                width: 140px;
            }

            .top-nav {
                gap: 20px;
                flex-wrap: wrap;
                padding-top: 0;
            }

            .top-nav a {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .main-container {
                padding: 180px 20px 40px;
            }

            .center-image {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header with Logo and Navigation -->
    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/see_through_title.PNG" alt="Jamie">
        </a>
        <nav class="top-nav">
            <a href="about.html">about</a>
            <a href="works.html">works</a>
            <a href="shop.html">shop</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <!-- Main Container with Center Image -->
    <div class="main-container">
        <div class="center-image">
            <img src="images/main_page_center_image.JPG" alt="Jamie Wong Illustration">
        </div>
    </div>
</body>
</html>
